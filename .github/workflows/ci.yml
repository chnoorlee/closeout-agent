name: verify

on:
  push:
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --extra dev --frozen
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium

      - name: Verify backend
        run: |
          uv pip check
          uv run ruff check backend
          uv run mypy backend/app
          uv run pytest -W error --cov=backend.app --cov-report=term-missing

      - name: Verify frontend
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Start application
        run: |
          .venv/bin/python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8081 > backend.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 > frontend.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8081/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8081/api/health > /dev/null
          curl --fail --silent http://127.0.0.1:5173 > /dev/null

      - name: Verify browser journeys
        run: npm --prefix frontend run e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            docs/images/*.png
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            frontend.log
          if-no-files-found: ignore
